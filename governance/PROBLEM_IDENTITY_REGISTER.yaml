version: "1.0"
problems:
  - problem_id: "HODGE-MILLENNIUM-001"
    name: "The Hodge Conjecture"
    canonical_statement: "Let X be a non-singular (smooth) complex projective algebraic variety of complex dimension n. For any integer 0 <= p <= n, every rational cohomology class of type (p,p), i.e., alpha in H^{2p}(X, Q) cap H^{p,p}(X), is a Q-linear combination of the cohomology classes of algebraic subvarieties of X of complex codimension p."
    domain: "Smooth complex projective algebraic varieties X over C, codimension p in {0, ..., dim_C(X)}"
    target_equation: "cl_X(Z^p(X)_Q) = Hdg^{2p}(X) := H^{2p}(X, Q) cap H^{p,p}(X)"
    assumptions_original:
      - "X is a smooth (non-singular) manifold"
      - "X is projective (admits a closed embedding into complex projective space P^N_C)"
      - "Base field is C"
      - "Coefficients are rational numbers Q"
    equivalent_forms:
      - "The cycle class map cl: CH^p(X)_Q -> Hdg^{2p}(X) is surjective."
      - "The Hodge conjecture holds for p = 2 on all smooth complex projective 4-folds (implies general Hodge conjecture via Deligne / standard reduction)."
    not_the_problem:
      - "Integral Hodge Conjecture (known to be FALSE due to Atiyah-Hirzebruch torsion counterexamples and Totaro-Kollar-Voisin counterexamples)"
      - "Kähler Hodge Conjecture for non-projective compact Kähler manifolds (known to be FALSE due to Claire Voisin, 2002)"
      - "Lefschetz (1,1) theorem for p = 1 (PROVED by Solomon Lefschetz, 1924)"
      - "Hodge conjecture for varieties of dimension <= 3 (PROVED via Hard Lefschetz theorem)"
    source_lock:
      primary_source: "Clay Mathematics Institute Millennium Prize Problem Statement: Pierre Deligne, 'The Hodge Conjecture' (2000)"
      authenticated: true

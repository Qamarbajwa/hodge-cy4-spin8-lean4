version: "1.1"
last_updated_utc: "2026-08-28T09:52:00Z"

drift_detection_rules:
  unjustified_assumption_blocks_promotion: true
  flagged_ccm_patterns:
    - pattern_id: "FLAG-CCM-01"
      name: "Silent Threshold Introduction"
      description: 'Introducing lambda >= lambda_0 without an explicit, verifiable bound or characterization of lambda_0.'
      severity: "HIGH"
    - pattern_id: "FLAG-CCM-02"
      name: "Unproved Positivity-Improving Assumption"
      description: 'Assuming e^-tA_lambda is positivity-improving (Perron-Frobenius/Jentzsch) without proving sign of the non-local arithmetic prime integral kernel.'
      severity: "CRITICAL"
    - pattern_id: "FLAG-CCM-03"
      name: "Unproved Ground-State Simplicity"
      description: 'Treating mu_+(lambda) as simple without proving dim ker(A_lambda|_{H_+} - mu_+ I) = 1.'
      severity: "CRITICAL"
    - pattern_id: "FLAG-CCM-04"
      name: "Unproved Parity Sector Ordering"
      description: 'Assuming ground state is even (xi_lambda(u^-1) = xi_lambda(u)) solely from [A_lambda, J] = 0.'
      severity: "CRITICAL"
    - pattern_id: "FLAG-CCM-05"
      name: "Unproved Uniform Spectral Gap"
      description: 'Assuming mu_2(lambda) - mu_1(lambda) >= delta > 0 uniformly as lambda -> \infty without asymptotic resolvent estimates.'
      severity: "HIGH"
    - pattern_id: "FLAG-CCM-06"
      name: "Unweighted Convergence Promotion Fallacy"
      description: 'Assuming unweighted L^1 or L^2 convergence implies locally uniform convergence of Mellin transforms on complex critical substrips.'
      severity: "CRITICAL"
    - pattern_id: "FLAG-CCM-07"
      name: "Finite vs Continuum Ground State Conflation"
      description: 'Conflating the finite Galerkin eigenvector xi_(lambda,N) with the continuum eigenfunction xi_lambda.'
      severity: "CRITICAL"


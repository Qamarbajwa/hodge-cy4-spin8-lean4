  - assumption_id: "ASM-004"
    target_problem: "CCM-A2"
    statement: 'The compact self-adjoint operator A_lambda restricted to H_+ has a non-degenerate lowest eigenvalue.'
    classification: "ORIGINAL"
    provenance: "CCM (2025) Section 8, Step 1"
    status: "OPEN_TARGET_HYPOTHESIS"

  - assumption_id: "ASM-005"
    target_problem: "CCM-A3"
    statement: 'Under the frozen CCM-A3 assumptions, normalized finite Galerkin ground minimizers converge strongly in H for fixed lambda, with eventual simplicity and even parity.'
    classification: "DERIVED"

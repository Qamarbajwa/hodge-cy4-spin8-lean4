targets:
  - problem_id: "CCM-SYM"
    name: "Semilocal Parity Commutation & Sector Decomposition"
    canonical_statement: >
      For any cutoff lambda > 1, the semilocal Weil quadratic form QW_lambda and its
      associated self-adjoint operator A_lambda on H_lambda = L^2([lambda^-1, lambda], d*u)
      commute with the scaling involution J: f(u) |-> f(u^-1), inducing an exact orthogonal
      eigenspace decomposition H_lambda = H_+ \oplus H_- into even and odd parity sectors.
    domain: 'H_lambda = L^2([lambda^-1, lambda], d*u), lambda > 1'
    quantifiers: '\forall lambda \in (1, \infty)'
    assumptions:
      - 'QW_lambda is the closed quadratic form defined in CCM (2025) Proposition 3.3'
      - 'Dom(QW_lambda) = {f in H_lambda : QW_lambda(f) < \infty}'
      - 'J is the isometric involution (J f)(u) = f(u^-1)'
    conclusion: '[A_lambda, J] = 0 and J(D(A_lambda)) = D(A_lambda)'
    equivalent_formulations:
      - 'QW_lambda(J f) = QW_lambda(f) for all f in Dom(QW_lambda)'
    non_equivalent_nearby_problems:
      - 'CCM-A1 (Spectral ordering: mu_+ < mu_-)'
      - 'Unbounded interval continuum symmetry on L^2(R_+^*)'
    dependencies:
      - 'CCM (2025) Proposition 3.3'
    off_critical_sensitivity: 'LOW (Structural involution symmetry)'
    forbidden_assumption_substitutions:
      - 'Do not assume mu_+ < mu_- follows from [A_lambda, J] = 0'
      - 'Do not assume ground state is positive without checking kernel signs'
      - 'Do not claim Dom(QW_lambda) = H^1 without primary source proof (PROOF-ERROR-007)'
    source: 'Connes–Consani–Moscovici, arXiv:2511.22755 (2025), Section 3.2'
    status: 'PROVED_IN_PRIMARY_SOURCE'

  - problem_id: "CCM-FIN-SE"
    name: "Finite-Section Simple-Even Ground-State Property"
    canonical_statement: >
      For fixed cutoff lambda > 1 and finite Galerkin dimension N, the smallest eigenvalue
      epsilon_N = lambda_min(QW_lambda^N) of the restricted finite-dimensional matrix QW_lambda^N
      on E_N is simple (multiplicity 1), and its corresponding normalized eigenvector xi_(lambda,N)
      (with delta_N(xi_(lambda,N)) = 1) is strictly even: J xi_(lambda,N) = xi_(lambda,N).
    domain: 'Finite Galerkin section E_N = span{u^{i 2\pi n / L} | n = -N, ..., N}, lambda > 1, N >= 1'
    quantifiers: '\forall lambda > 1, \forall N >= N_0(lambda)'
    assumptions:
      - 'QW_lambda^N is the restricted quadratic form on E_N (CCM Def 3.2)'
      - 'J is the discrete reflection on Fourier basis modes: J(u^{i 2\pi n / L}) = u^{-i 2\pi n / L}'
      - 'delta_N is the canonical finite-section evaluation functional in CCM Theorem 5.10'
    conclusion: 'dim ker(QW_lambda^N - epsilon_N I) = 1, J xi_(lambda,N) = xi_(lambda,N), and delta_N(xi_(lambda,N)) = 1'
    equivalent_formulations:
      - 'Admissibility hypotheses of CCM Theorem 5.10 on the finite section E_N'
    non_equivalent_nearby_problems:
      - 'CCM-A1/A2 (Continuum operator simple-even ground state)'
      - 'CCM-A3 (Convergence of finite eigenvectors to continuum ground state)'
    dependencies:
      - 'CCM-SYM'
    off_critical_sensitivity: 'HIGH (Direct hypothesis required for finite real zeros in CCM Thm 5.10)'
    forbidden_assumption_substitutions:
      - 'Do not confuse finite-N simple-even property with continuum simple-even theorem'
      - 'Do not assume CCM Theorem 5.10 holds without the finite-N simple-even hypothesis'
    source: 'Connes–Consani–Moscovici, arXiv:2511.22755 (2025), Theorem 5.10'
    status: 'OPEN_OR_HYPOTHESIS_OF_THM_5_10'

  - problem_id: 'CCM-A1'
    name: 'Continuum Ground-State Sector Ordering (Parity Gap)'
    canonical_statement: >
      The lowest eigenvalue of the even parity sector mu_+(lambda) is strictly lower than the
      lowest eigenvalue of the odd parity sector mu_-(lambda): mu_+(lambda) < mu_-(lambda),
      ensuring that the continuum ground state xi_lambda associated with A_lambda lies in the even sector H_+.
    domain: 'H_lambda = L^2([lambda^-1, lambda], d*u), lambda range SOURCE_UNSPECIFIED / TO_BE_DETERMINED'
    quantifiers: '\forall lambda in required range (all lambda > 1, or lambda >= lambda_0, or cofinal sequence)'
    assumptions:
      - 'A_lambda is the self-adjoint Friedrichs operator of QW_lambda'
      - 'H_+ = {f \in H_lambda | f(u^-1) = f(u)}, H_- = {f \in H_lambda | f(u^-1) = -f(u)}'
      - 'mu_+(lambda) = \inf_{f \in H_+\cap Dom(QW_lambda), \|f\|=1} QW_lambda(f)'
      - 'mu_-(lambda) = \inf_{f \in H_-\cap Dom(QW_lambda), \|f\|=1} QW_lambda(f)'
    conclusion: 'mu_+(lambda) < mu_-(lambda)'
    equivalent_formulations:
      - 'Every continuum ground-state eigenfunction xi_lambda satisfying A_lambda xi_lambda = mu(lambda) xi_lambda is even: xi_lambda(u^-1) = xi_lambda(u)'
    non_equivalent_nearby_problems:
      - 'CCM-SYM (Parity commutation alone)'
      - 'CCM-FIN-SE (Finite-section simple-even property)'
    dependencies:
      - 'CCM-SYM'
      - 'Arithmetic prime kernel depression analysis on even test functions'
    off_critical_sensitivity: 'HIGH (Ground state parity determines continuum admissibility)'
    forbidden_assumption_substitutions:
      - 'Do not substitute generic heat kernel positivity without proving sign of non-local prime terms'
      - 'Do not inject unproved lambda >= lambda_0 without explicit construction'
    source: 'Connes–Consani–Moscovici, arXiv:2511.22755 (2025), Section 8, Step 1'
    status: 'OPEN'
    bounded_local_result:
      task_id: 'RH-CCM-A1A2-WINDOW-OPENNESS-001'
      status: 'COMPLETED_WITH_LIMITATIONS'
      statement: 'There exists delta > 0 with delta < 0.5 log(5) - 0.8 such that mu_+(lambda) < mu_-(lambda) on lambda = exp(ell), ell in [0.8, 0.8 + delta).'
      reviewed_candidate: 'git:7be8055a6160504202f00dccf7fa8442cea2ba73'
      reviewed_tree: 'git-tree:43d03aa6e1ef29f6f8b9b4c8d224aa0bc2c9dc35'
      evidence: 'Fresh IND1 review; quantitative delta and required/global range remain open.'

  - problem_id: 'CCM-A2'
    name: 'Continuum Even-Sector Ground-State Simplicity (Non-Degeneracy)'
    canonical_statement: >
      The lowest eigenvalue mu_+(lambda) of A_lambda restricted to the even sector H_+ has
      geometric and algebraic multiplicity exactly equal to 1.
    domain: 'H_+ \subset L^2([lambda^-1, lambda], d*u), lambda range SOURCE_UNSPECIFIED / TO_BE_DETERMINED'
    quantifiers: '\forall lambda in required range'
    assumptions:
      - 'A_lambda restricted to H_+ has purely discrete spectrum with compact resolvent'
      - 'mu_+(lambda) = \inf_{f \in H_+\cap Dom(QW_lambda), \|f\|=1} QW_lambda(f)'
    conclusion: 'dim ker(A_lambda|_{H_+} - mu_+(lambda) I) = 1'
    equivalent_formulations:
      - 'The normalized continuum even ground state xi_lambda is uniquely determined up to a scalar factor in {-1, +1}'
    non_equivalent_nearby_problems:
      - 'Simplicity of higher excited eigenvalues'
      - 'Uniform spectral gap to the second even eigenvalue'
    dependencies:
      - 'CCM-A1'
    off_critical_sensitivity: 'MEDIUM'
    forbidden_assumption_substitutions:
      - 'Do not assume simplicity follows solely from compact resolvent'
    source: 'Connes–Consani–Moscovici, arXiv:2511.22755 (2025), Section 8, Step 1'
    status: 'OPEN'
    bounded_local_result:
      task_id: 'RH-CCM-A1A2-WINDOW-OPENNESS-001'
      status: 'COMPLETED_WITH_LIMITATIONS'
      statement: 'The even-sector ground state is simple on the same existential interval ell in [0.8, 0.8 + delta), with delta > 0 below 0.5 log(5) - 0.8.'
      reviewed_candidate: 'git:7be8055a6160504202f00dccf7fa8442cea2ba73'
      reviewed_tree: 'git-tree:43d03aa6e1ef29f6f8b9b4c8d224aa0bc2c9dc35'
      evidence: 'Fresh IND1 review; quantitative delta and required/global range remain open.'

  - problem_id: 'CCM-A3'
    name: 'Fixed-Lambda Galerkin Ground-State Strong Convergence'
    canonical_statement: >
      For fixed cutoff lambda > 1, assuming the continuum ground state xi_lambda of A_lambda is isolated
      and simple (conditional continuum hypothesis), the direct compact-form-domain argument in
      RH-CCM-A3-DIRECT-PROOF-001 applies to the form core E = \bigcup E_N, ensuring that for large N the finite Ritz eigenvalue
      epsilon_N = lambda_min(QW_lambda^N) is simple, inherits even parity J xi_(lambda,N) = xi_(lambda,N),
      and normalized Ritz eigenvectors satisfy e^{i\theta_N} xi_(lambda,N) -> xi_lambda strongly in H_lambda.
    domain: 'Fixed lambda > 1, N -> \infty, E_N \subset Dom(QW_lambda)'
    quantifiers: '\forall lambda > 1, \exists \theta_N \in \{0, \pi\} : \lim_{N -> \infty} \|e^{i\theta_N} \xi_(lambda,N) - \xi_lambda\|_{H_lambda} = 0'
    assumptions:
      - 'CCM (2025) Proposition 3.4 (Form-core property and eigenvalue convergence lambda_min(QW_lambda^N) -> mu(lambda))'
      - 'CCM-A1 and CCM-A2 hold for lambda (simple isolated continuum ground state xi_lambda in H_+)'
      - 'J-invariance of Galerkin subspaces E_N'
    conclusion: 'Eventual simplicity, parity inheritance, and strong H_lambda convergence of Ritz ground states'
    equivalent_formulations:
      - 'Rank-one spectral projection convergence \|P_N - P_\lambda\| \to 0 in H_lambda'
    non_equivalent_nearby_problems:
      - 'Eigenvalue-only convergence (CCM Prop 3.4 proves lambda_min(QW_lambda^N) -> mu(lambda) only)'
      - 'Pointwise boundary normalization convergence (CCM-A3N)'
    dependencies:
      - 'CCM-A1'
      - 'CCM-A2'
      - 'CCM (2025) Proposition 3.4'
      - 'RH-CCM-A3-DIRECT-PROOF-001 direct proof'
    off_critical_sensitivity: 'MEDIUM'
    forbidden_assumption_substitutions:
      - 'Do not conflate finite Galerkin eigenvector xi_(lambda,N) with continuum eigenfunction xi_lambda'
      - 'Do not assume L^2 convergence automatically implies boundary normalization xi_(lambda,N)(lambda) -> xi_lambda(lambda) (PROOF-ERROR-008)'
    source: 'CCM (2025) Proposition 3.4; RH-CCM-A3-DIRECT-PROOF-001'
    status: 'INDEPENDENTLY_VERIFIED_CONDITIONAL'

  - problem_id: 'CCM-A3N'
    name: 'Finite-to-Continuum Normalization Bridge'
    canonical_statement: >
      Bridge the finite-section evaluation functional normalization delta_N(xi_(lambda,N)) = 1 used in
      CCM Theorem 5.10 with the continuum normalization (either L^2 unit norm \|xi_lambda\| = 1 or boundary
      normalization xi_lambda(lambda) = 1), ensuring that the regularized determinant scaling factor converges
      to the source constant without destroying strip convergence.
    domain: 'Fixed lambda > 1, N -> \infty'
    quantifiers: '\forall lambda > 1, \lim_{N -> \infty} c_N = c_\lambda \neq 0'
    assumptions:
      - 'CCM Theorem 5.10 normalization delta_N(xi_(lambda,N)) = 1'
      - 'CCM-A3 strong H_lambda convergence'
    conclusion: 'Normalization compatibility between finite determinant and continuum Mellin transform'
    equivalent_formulations:
      - 'Determinant scaling factor absorption lemma'
    non_equivalent_nearby_problems:
      - 'CCM-A3 (L^2 eigenvector convergence alone)'
    dependencies:
      - 'CCM-A3'
      - 'CCM Theorem 5.10'
    off_critical_sensitivity: 'HIGH (Scalar normalization enters directly into determinant zero representation)'
    forbidden_assumption_substitutions:
      - 'Do not assume L^2 convergence implies pointwise boundary evaluation convergence without Sobolev regularity (PROOF-ERROR-008)'
    source: 'Connes–Consani–Moscovici (2025), Theorem 5.10 and Section 8'
    status: 'OPEN_REGULARITY_OR_DETERMINANT_SCALING_BRIDGE'

  - problem_id: 'CCM-B*'
    name: 'Quantitative Arithmetic-Prolate Weighted Ground-State Approximation'
    canonical_statement: >
      For each closed critical substrip |Im z| <= a < 1/2, prove that the continuum ground state
      xi_lambda is sufficiently approximated by the source-authenticated prolate comparison function
      k_lambda = E(h_lambda) (where h_lambda is the unique linear combination of prolate modes h_(0,lambda)
      and h_(4,lambda) with vanishing integral, CCM Eq 7.6) such that the proved uniform convergence
      \widehat{k_lambda}(z) -> \Xi(z) on |Im z| <= a (CCM Lemma 7.3) transfers to \widehat{xi_lambda}(z):
      \lim_{\lambda -> \infty} \frac{\widehat{xi_lambda}(z)}{\widehat{xi_lambda}(0)} = \frac{\Xi(z)}{\Xi(0)}.
    domain: 'Weighted space L^1([lambda^-1, lambda], (u^a + u^-a) d*u) for 0 <= a < 1/2, lambda -> \infty'
    quantifiers: '\forall a \in [0, 1/2), \exists C_lambda > 0 : \|\xi_\lambda - C_\lambda k_\lambda\|_{(1,a)} \to 0'
    assumptions:
      - 'CCM-SYM, CCM-A1, CCM-A2 hold on the asymptotic range'
      - 'k_lambda = E(h_lambda) is defined by CCM (2025) Section 7, Eqs (7.1)–(7.8)'
      - 'E is the arithmetic map E(f)(u) = u^{1/2} \sum_{n >= 1} f(nu) (CCM Eq 7.2)'
      - 'CCM Lemma 7.3: \widehat{k_lambda}(z) -> \Xi(z) uniformly on closed substrips of |Im z| < 1/2'
    conclusion: 'Locally uniform Mellin transform convergence \widehat{xi_lambda}(z)/\widehat{xi_lambda}(0) -> \Xi(z)/\Xi(0) on |Im z| <= a'
    equivalent_formulations:
      - 'Approximation of xi_lambda by k_lambda in any sufficient topology transferring Lemma 7.3'
    non_equivalent_nearby_problems:
      - 'Replacing h_lambda with h_(0,lambda) alone or psi_0 (REG-MATH-008)'
      - 'Replacing arithmetic map E with logarithmic coordinate change kappa (PROOF-ERROR-006)'
    dependencies:
      - 'CCM-A1'
      - 'CCM-A2'
      - 'CCM-A3'
      - 'CCM-A3N'
      - 'CCM (2025) Section 7 (Eqs 7.1–7.8, Lemma 7.3)'
    off_critical_sensitivity: 'ABSOLUTE (Traps any off-critical zero rho = 1/2 \pm delta + i gamma having delta < 1/2)'
    forbidden_assumption_substitutions:
      - 'Do not label weighted L^1 as uniquely mathematically necessary; it is an authenticated sufficient condition'
      - 'Do not replace h_lambda with zeroth prolate mode alone (PROOF-ERROR-006 / REG-MATH-008)'
    source: 'Connes–Consani–Moscovici, arXiv:2511.22755 (2025), Sections 7 & 8; arXiv:2307.03961'
    status: 'OPEN'

external_theorems:
  - theorem_id: "EXT-THM-001"
    name: "Akiva Groskin Archimedean Tail Order and Certification"
    source: "Akiva Groskin, arXiv:2607.02828v3 (2026)"
    theorem_number: "Lemma 3.1, Theorem 3.2, Corollary 3.3"
    scope: "Fixed finite frequency subspace E_N, fixed (c, N), T > max(rho* N, 7), T -> \\infty"
    exact_statement: >
      For fixed c = lambda^2 and finite Galerkin dimension N, the Archimedean integration truncation
      error satisfies 0 <= Q_\infty - Q_T <= B_T I on E_N for all T > max(rho* N, 7), with B_T -> 0 as T -> \infty.
    assumptions_verified: true
    how_used: "Strict upper-bound certification of finite numerical integration cutoff."

  - theorem_id: "EXT-THM-002"
    name: "CCM Form Core and Monotonic Eigenvalue Convergence"
    source: "Connes–Consani–Moscovici, arXiv:2511.22755 (2025)"
    theorem_number: "Proposition 3.3 & Proposition 3.4"
    scope: "Semilocal interval [lambda^-1, lambda], lambda > 1, form domain Dom(QW_lambda) = {f : QW_lambda(f) < \\infty}"
    exact_statement: >
      QW_lambda is closed, lower-bounded, and lower-semicontinuous on H_lambda = L^2([lambda^-1, lambda], d*u).
      The nested union E = \bigcup E_N is a form core for QW_lambda, and lambda_min(QW_lambda^N) \downarrow \mu(\lambda).
    assumptions_verified: true
    how_used: "Forms the mathematical foundation for finite-to-continuum spectral approximation."

  - theorem_id: "EXT-THM-003"
    name: "CCM Regularized Determinant Identity on Finite Sections"
    source: "Connes–Consani–Moscovici, arXiv:2511.22755 (2025)"
    theorem_number: "Theorem 5.10"
    scope: 'Hilbert space E''_N \oplus E_N^\perp, rank-one perturbed scaling operator D_log^(lambda,N), finite eigenvector xi_(lambda,N)'
    exact_statement: >
      Under the hypothesis that epsilon_N = lambda_min(QW_lambda^N) is simple and xi_(lambda,N) is even with delta_N(xi_(lambda,N)) = 1,
      the regularized spectral determinant satisfies det_reg(D_log^(lambda,N) - z) = -i lambda^(-iz) \widehat{xi_(lambda,N)}(z),
      and all its zeros lie on the real line on E_N.
    assumptions_verified: false
    how_used: "Connects the finite-dimensional Dirac determinant to the finite Galerkin eigenvector Mellin transform."

  - theorem_id: "EXT-THM-004"
    name: "CCM Prolate-to-Xi Uniform Substrip Convergence"
    source: "Connes–Consani–Moscovici, arXiv:2511.22755 (2025) & arXiv:2307.03961"
    theorem_number: "Lemma 7.3 & Section 7"
    scope: "Prolate comparison mode k_lambda = E(h_lambda) on [lambda^-1, lambda], closed substrips |Im z| <= a < 1/2"
    exact_statement: >
      The reference mode k_lambda = E(h_lambda) (constructed from prolate modes h_(0,lambda) and h_(4,lambda) of PW_lambda
      with vanishing integral) satisfies \lim_{lambda \to \infty} \widehat{k_lambda}(z) = \Xi(z) uniformly on compact subsets of |Im z| < 1/2.
    assumptions_verified: true
    how_used: "Provides the explicit proved prolate bridge to the Riemann Xi function on critical substrips."


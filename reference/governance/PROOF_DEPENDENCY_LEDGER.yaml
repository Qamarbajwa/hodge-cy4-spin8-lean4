  - theorem_id: "EXT-THM-006"
    name: "Chuk / Zhu Fixed-Window Certified Positivity and Simple-Even Ground State"
    source: "arXiv:2608.24827 [v1: Marcus Chuk (2026-08-25); v2: Xuefeng Zhu (2026-09-02)]"
    theorem_number: "v1: Theorem 1, 7, 8, Cor 9; v2: Theorem 1.2, 1.1, 6.2, Cor 6.3"
    scope: "Support [-0.8,0.8] for the certified result; Theorem 7 (v1) / 1.1 (v2) gives the parameterized reduction for L>0"
    exact_statement: >
      Theorem 1 (v1) / 1.2 (v2) gives Q(f) >= 8.9e-18 ||f||^2 for real even f supported in
      [-0.8,0.8]. Theorem 7 (v1) / 1.1 (v2) reduces the form to a finite Legendre matrix under
      beta* = log(Tsharp/(2 pi)) - 1/Tsharp - A_L > 0, with
      A_L = sum_{log n < 2L} 2 Lambda(n)/sqrt(n). Theorem 8 (v1) / 6.2 (v2) gives
      8.9e-18 <= lambda_1^even <= 2.523e-16,
      lambda_2^even >= 2.085e-12, and
      8.206e-15 <= lambda_1^odd <= 2.347e-14 at L=0.8.
      Corollary 9 (v1) / 6.3 (v2) extends the 8.9e-18 lower bound to complex f.
      The certified additive gap g_cert = 7.9537e-15 is a repository-derived directed subtraction
      (8.206e-15 - 2.523e-16), not a verbatim textual constant in the source.
    assumptions_verified: true
    how_used: "Unitary fixed-scale transfer to CCM-A1-L08 and CCM-A2-L08 at lambda=e^0.8; invariant across v1 and v2; no general-lambda inference."


  - theorem_id: "EXT-THM-007"
    name: "Parity-Gap Continuation Lemma"
    source: "Standard min-max perturbation consequence; project candidate"
    theorem_number: "Conditional lemma in RH-CCM-A1A2-CHUK-TRANSFER-001"
    scope: "Common fixed Hilbert space, common parity-invariant closed form domain, and uniform bounded form difference"
    exact_statement: >
      If |q_L[f]-q_L0[f]| <= epsilon ||f||^2 and
      g = min(lambda_1^odd(L0)-lambda_1^even(L0),
      lambda_2^even(L0)-lambda_1^even(L0)) > 0, then epsilon < g/2
      preserves a simple even ground state.
    assumptions_verified: false
    how_used: "Candidate continuation criterion; the CCM-specific form-variation estimate and threshold crossing control remain open."
